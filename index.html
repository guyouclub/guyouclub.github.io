<!DOCTYPE html>
<!--
  网页版的 HTML 模板：有了这个文件，开发服务器和 expo export 都用它代替 Expo 自带的模板
  （node_modules/expo/node_modules/@expo/cli/static/template/index.html，本文件照它改的）。
  只为一件事改：不让浏览器翻译页面（决定 #174）。翻译会把文字节点换成 font 等元素，React 再更新文字时对不上，界面就乱了。
  - lang 取 app.json 的 web.lang（zh-CN）。原来是默认的 en，中文用户的浏览器把页面当外文，就提示翻译。
  - meta google notranslate：Chrome、Edge 不提示翻译。
  - translate="no"、class="notranslate"：用户自己点翻译也不翻。Chrome、Safari 认 html 上的，Firefox 只认 body 上的，两处都写。
-->
<html lang="zh-CN" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>咕游社</title>
    <!-- react-native-web 推荐的样式重置：https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* html、body 占满窗口 */
      html,
      body {
        height: 100%;
      }
      /* 页面本身不滚动，由 ScrollView 滚 */
      body {
        overflow: hidden;
      }
      /* 根元素占满窗口 */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  <link rel="icon" href="/favicon.ico"/><link rel="preload" href="/_expo/static/css/global-01cd34db3f1aa28e7137a4ed3e79a318.css" as="style">
<link rel="stylesheet" href="/_expo/static/css/global-01cd34db3f1aa28e7137a4ed3e79a318.css"></head>

  <body translate="no" class="notranslate">
    <noscript>需要开启 JavaScript 才能使用咕游社。</noscript>
    <div id="root"></div>
  <script src="/_expo/static/js/web/entry-588de1b2fc24775491a1525e5745355b.js" defer></script>
</body>
</html>
